name: Android APK Build (Self-hosted Free)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: powershell
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Clean and build Debug APK
        shell: powershell
        run: |
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify APK and compute SHA-256
        shell: powershell
        run: |
          $apk = "app/build/outputs/apk/debug/app-debug.apk"
          if (!(Test-Path $apk)) { throw "APK was not produced" }
          Copy-Item $apk "Nexvary-Andalus-Studio-v0.8.25-debug.apk"
          $hash = (Get-FileHash "Nexvary-Andalus-Studio-v0.8.25-debug.apk" -Algorithm SHA256).Hash.ToLower()
          "$hash  Nexvary-Andalus-Studio-v0.8.25-debug.apk" | Out-File -Encoding ascii "Nexvary-Andalus-Studio-v0.8.25-debug.apk.sha256"
          Write-Host "APK SHA-256: $hash"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexvary-Andalus-Studio-v0.8.25-debug
          path: |
            apps/android/Nexvary-Andalus-Studio-v0.8.25-debug.apk
            apps/android/Nexvary-Andalus-Studio-v0.8.25-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
