name: Android 15 Visual Smoke

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android15-visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android15-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: apps/android
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true

      - name: Boot Android 15, install, launch and capture
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            mkdir -p artifacts/android15
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.nexvary.andalus
            adb shell am start -W -n com.nexvary.andalus/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q "com.nexvary.andalus"
            adb exec-out screencap -p > artifacts/android15/home.png
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml artifacts/android15/window.xml || true
            test -s artifacts/android15/home.png

      - name: Upload Android 15 evidence
        uses: actions/upload-artifact@v4
        with:
          name: Nexvary-Andalus-Studio-Android15-Visual-Smoke
          path: artifacts/android15/
          if-no-files-found: error
          retention-days: 14
