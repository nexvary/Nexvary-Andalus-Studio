name: Navigation Integrity Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/navigation-integrity-gate.yml"
      - ".github/workflows/ui-release-gate.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/navigation-integrity-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigation-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  navigation-and-ui-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Fast release preflight
        working-directory: apps/android
        run: >-
          gradle
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          --stacktrace
          --no-daemon

      - name: Enable KVM acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Prepare deterministic Android gate runner
        run: |
          cat > /tmp/run-release-integrity.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          mkdir -p artifacts/release-integrity/instrumentation
          mkdir -p artifacts/release-integrity/small-phone
          mkdir -p artifacts/release-integrity/modern-phone

          APP_APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="$(find apps/android/app/build/outputs/apk/androidTest/debug -name '*androidTest.apk' -print -quit)"
          test -s "${APP_APK}"
          test -n "${TEST_APK}"
          test -s "${TEST_APK}"

          adb wait-for-device
          # Host launcher ANRs are emulator noise, not application failures. Suppress their
          # dialogs, then independently prove our app owns the foreground before evidence capture.
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put secure anr_show_background 0 || true
          adb install -r "${APP_APK}"
          adb install -r -t "${TEST_APK}"

          RUNNER="com.nexvary.andalus.test/androidx.test.runner.AndroidJUnitRunner"

          run_gate() {
            local class_name="$1"
            local label="$2"
            local output="artifacts/release-integrity/instrumentation/${label}.txt"

            set +e
            adb shell am instrument -w -r -e class "${class_name}" "${RUNNER}" | tee "${output}"
            local adb_status=${PIPESTATUS[0]}
            set -e

            test "${adb_status}" -eq 0
            grep -Fq "OK (" "${output}"
            if grep -Eq "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed|shortMsg=Process crashed" "${output}"; then
              echo "Instrumentation gate ${label} failed"
              exit 1
            fi
          }

          ensure_app_foreground() {
            local focus=""
            for attempt in 1 2 3; do
              adb shell am start -W -n com.nexvary.andalus/.MainActivity >/tmp/andalus-start.txt
              sleep 1
              focus="$(adb shell dumpsys window | grep -m1 'mCurrentFocus' || true)"
              echo "Foreground check ${attempt}: ${focus}"
              if printf '%s' "${focus}" | grep -Fq "com.nexvary.andalus"; then
                return 0
              fi
              # Dismiss an emulator/system dialog only when our activity does not own focus.
              adb shell input keyevent KEYCODE_BACK || true
              sleep 1
            done
            echo "Nexvary Andalus Studio did not obtain foreground focus"
            return 1
          }

          capture_ui() {
            local folder="$1"
            local png="artifacts/release-integrity/${folder}/home.png"
            local xml="artifacts/release-integrity/${folder}/window.xml"

            adb shell am force-stop com.nexvary.andalus
            ensure_app_foreground
            adb exec-out screencap -p > "${png}"
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml "${xml}" || true
            test -s "${png}"

            if test -s "${xml}" && grep -Eiq "Pixel Launcher|isn't responding|is not responding|Application Error" "${xml}"; then
              echo "System error dialog contaminated UI evidence for ${folder}"
              exit 1
            fi
          }

          # Navigation Integrity Gate: every service route, in-page Back, system Back,
          # primary tabs, About and all internal destinations.
          run_gate "com.nexvary.andalus.NavigationIntegrityGateTest" "navigation-integrity"

          # UI Release Gate on a compact phone viewport.
          adb shell wm size 1080x1920
          adb shell wm density 420
          sleep 1
          run_gate "com.nexvary.andalus.UiReleaseGateTest" "ui-small-phone"
          capture_ui "small-phone"

          # UI Release Gate on a modern tall phone viewport.
          adb shell wm size 1080x2400
          adb shell wm density 420
          sleep 1
          run_gate "com.nexvary.andalus.UiReleaseGateTest" "ui-modern-phone"
          capture_ui "modern-phone"

          adb shell wm size reset || true
          adb shell wm density reset || true
          EOF
          chmod +x /tmp/run-release-integrity.sh

      - name: Navigation Integrity Gate + UI Release Gate on Android 15
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: /tmp/run-release-integrity.sh

      - name: Capture logcat on failure
        if: failure()
        run: adb logcat -d > artifacts/release-integrity/logcat.txt || true

      - name: Upload release integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-integrity-evidence
          path: |
            artifacts/release-integrity/
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
