name: Android APK Manual Fallback

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: android-manual-release-${{ github.ref }}
  cancel-in-progress: true

# Normal pushes are handled by navigation-integrity-gate.yml, which now builds,
# tests, runs the Android 15 emulator once, captures UI evidence, attests, and
# uploads the APK in a single pipeline. This workflow remains as a manual
# fallback so we do not pay for a second Gradle build and a second emulator boot.
jobs:
  manual-apk-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug APK
        working-directory: apps/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK and checksum
        run: |
          set -euo pipefail
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk
          sha256sum artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk > artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk.sha256

      - name: Attest APK build provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Nexvary-Andalus-Studio-v0.8.25-manual-apk
          path: |
            artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk
            artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
