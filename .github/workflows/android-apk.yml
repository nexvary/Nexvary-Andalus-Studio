name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK and checksum
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ../../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../../artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk
          sha256sum ../../artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk > ../../artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexvary-Andalus-Studio-v0.8.25-debug
          path: |
            artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk
            artifacts/Nexvary-Andalus-Studio-v0.8.25-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
