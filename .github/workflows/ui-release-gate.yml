name: UI Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/ui-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-phone-matrix:
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_2, pixel_7]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Android lint
        working-directory: apps/android
        run: gradle :app:lintDebug --stacktrace --no-daemon
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi
      - name: UI Release Gate on Android 15
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          PROFILE: ${{ matrix.profile }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -lc 'set -euo pipefail; gradle -p apps/android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nexvary.andalus.UiReleaseGateTest --stacktrace --no-daemon; mkdir -p artifacts/ui/${PROFILE}; adb shell am force-stop com.nexvary.andalus; adb shell am start -W -n com.nexvary.andalus/.MainActivity; sleep 3; adb exec-out screencap -p > artifacts/ui/${PROFILE}/home.png; adb shell uiautomator dump /sdcard/window.xml || true; adb pull /sdcard/window.xml artifacts/ui/${PROFILE}/window.xml || true; test -s artifacts/ui/${PROFILE}/home.png'
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-release-${{ matrix.profile }}
          path: |
            artifacts/ui/${{ matrix.profile }}/
            apps/android/app/build/reports/lint-results-debug.html
            apps/android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
