name: Stage 825 Quality Gate

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage825-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/andalus-pattern-engine/pyproject.toml
            packages/floorplan-engine/pyproject.toml
            packages/andalus-architecture-engine/pyproject.toml
            packages/project-core/pyproject.toml
            packages/materials-engine/pyproject.toml
            packages/export-engine/pyproject.toml
            packages/asset-registry/pyproject.toml
            packages/scene-export/pyproject.toml
            packages/security-core/pyproject.toml
            services/ai-api/pyproject.toml
      - name: Install deterministic packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/andalus-pattern-engine[dev]"
          pip install -e "packages/floorplan-engine[dev]"
          pip install -e "packages/andalus-architecture-engine[dev]"
          pip install -e "packages/project-core[dev]"
          pip install -e "packages/materials-engine[dev]"
          pip install -e "packages/export-engine[dev]"
          pip install -e "packages/asset-registry[dev]"
          pip install -e "packages/scene-export[dev]"
          pip install -e "packages/security-core[dev]"
          pip install -e "services/ai-api[dev]"
          pip install "jsonschema>=4.23,<5"
      - name: Ruff
        run: |
          ruff check packages/andalus-pattern-engine/src packages/andalus-pattern-engine/tests
          ruff check packages/floorplan-engine/src packages/floorplan-engine/tests
          ruff check packages/andalus-architecture-engine/src packages/andalus-architecture-engine/tests
          ruff check packages/project-core/src packages/project-core/tests
          ruff check packages/materials-engine/src packages/materials-engine/tests
          ruff check packages/export-engine/src packages/export-engine/tests
          ruff check packages/asset-registry/src packages/asset-registry/tests
          ruff check packages/scene-export/src packages/scene-export/tests
          ruff check packages/security-core/src packages/security-core/tests
          ruff check services/ai-api/src services/ai-api/tests
      - name: Tests
        run: |
          pytest -q \
            packages/andalus-pattern-engine/tests \
            packages/floorplan-engine/tests \
            packages/andalus-architecture-engine/tests \
            packages/project-core/tests \
            packages/materials-engine/tests \
            packages/export-engine/tests \
            packages/asset-registry/tests \
            packages/scene-export/tests \
            packages/security-core/tests \
            services/ai-api/tests
      - name: Schema and version gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from nexvary_andalus_api.app import app

          schema = json.loads(Path("packages/design-schema/andalus-project.schema.json").read_text())
          sample = json.loads(Path("packages/design-schema/sample-project.json").read_text())
          Draft202012Validator(schema).validate(sample)
          assert schema["properties"]["version"]["const"] == "0.8.25"
          assert sample["version"] == "0.8.25"
          assert app.version == "0.8.25"
          print("Stage 825 Python/schema gate: PASS")
          PY

  web-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  android-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Android security policy gate
        run: |
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' app/src/main/AndroidManifest.xml
          grep -q 'cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle :app:assembleDebug --stacktrace
