[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvary-andalus-materials-engine"
version = "0.6.25"
description = "Material catalog, takeoff and user-priced BOM engine for Nexvary Andalus Studio"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
