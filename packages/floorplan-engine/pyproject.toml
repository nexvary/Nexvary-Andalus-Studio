[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvary-andalus-floorplan-engine"
version = "0.2.0"
description = "Deterministic 2D floor-plan geometry engine for Nexvary Andalus Studio"
requires-python = ">=3.11"
license = {text = "Proprietary - repository owner; third-party components separately licensed"}

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
